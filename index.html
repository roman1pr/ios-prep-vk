<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>iOS собес VK — повтор</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--txt:#e6e8ee;--mut:#9aa1ad;--acc:#4f9dff;--bd:#2a2f3a;--ok:#5ad08a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:var(--acc)}
code{font:13px/1.4 ui-monospace,Menlo,monospace;background:#262b36;padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
pre{max-width:100%;white-space:pre;background:#11141a;border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto;margin:6px 0 10px;-webkit-overflow-scrolling:touch}
pre code{background:none;padding:0;font-size:12.5px;overflow-wrap:normal}
.bar{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;align-items:center}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font-size:15px;min-height:42px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.bar .ttl{flex:1;min-width:0;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
main{max-width:860px;margin:0 auto;padding:12px 12px 80px;overflow-x:hidden}
h1{font-size:22px;margin:6px 0 4px}
.sub{color:var(--mut);font-size:14px;margin-bottom:12px}
#q{width:100%;font-size:17px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--txt);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:block;text-decoration:none;color:var(--txt);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 12px;min-height:96px}
.tile:active{background:var(--card2)}
.tile .n{color:var(--mut);font-size:12px}
.tile .h{font-weight:650;font-size:16px;margin:2px 0 4px}
.tile .c{color:var(--mut);font-size:12.5px}
.topic{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0;overflow:hidden;min-width:0}
.topic>summary{list-style:none;padding:12px;cursor:pointer}
.topic>summary::-webkit-details-marker{display:none}
.topic .tt{font-weight:650;font-size:16px}
.call{color:#cfe3ff;font-size:14.5px;margin-top:6px;border-left:3px solid var(--acc);padding-left:8px}
.call b{color:var(--acc);font-weight:600}
.more{color:var(--mut);font-size:12px;margin-top:6px}
.topic[open] .more{display:none}
.det{padding:0 12px 12px;border-top:1px dashed var(--bd);overflow-wrap:anywhere;min-width:0}
.det h4{margin:12px 0 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.det ul{margin:4px 0;padding-left:18px}
.det li{margin:5px 0}
.cap{font-size:13.5px;color:#cfd6e2;margin-top:8px}
.sec-lbl{color:var(--mut);font-size:12px}
.nav2{display:flex;gap:8px;margin-top:18px}
.nav2 a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chk li{margin:10px 0}
.chk .s{color:var(--mut);font-size:12px}
.empty{color:var(--mut);padding:20px;text-align:center}
.subcard{display:block;text-decoration:none;color:var(--txt);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;min-width:0}
.subcard:active{background:var(--card2)}
.subcard .h{font-weight:650;font-size:16.5px}
.subcard .sm{color:#cfe3ff;font-size:14px;margin-top:3px}
.subcard .tl{color:var(--mut);font-size:12.5px;margin-top:6px;overflow-wrap:anywhere}
.subcard .go{color:var(--acc);font-size:13px;margin-top:6px}
.crumb{flex:1;min-width:0;text-align:center;line-height:1.2}
.crumb a,.crumb span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb a{color:var(--mut);font-size:12px;text-decoration:none}
.crumb span{font-weight:600;font-size:15px}
.chk h3{font-size:15px;margin:18px 0 0;color:var(--acc)}
.chk h3 a{text-decoration:none}
.tw{overflow-x:auto;max-width:100%;margin:6px 0 10px;border:1px solid var(--bd);border-radius:10px;-webkit-overflow-scrolling:touch}
.tw table{border-collapse:separate;border-spacing:0;font-size:12.5px;line-height:1.35;min-width:100%}
.tw th,.tw td{padding:6px 8px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);text-align:left;vertical-align:top;overflow-wrap:normal;word-break:normal;min-width:110px;max-width:220px}
.tw thead th{background:var(--card2);color:var(--acc);font-weight:650}
.tw tbody th{font-weight:600;color:var(--txt)}
.tw tr>:first-child{position:sticky;left:0;z-index:1;background:var(--card2);min-width:84px;max-width:120px}
.tw tr:last-child>*{border-bottom:0}.tw tr>:last-child{border-right:0}
.tw code{font-size:11.5px;white-space:normal}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<main id="app"></main>
<script>
const R=String.raw;const S=[];const put=s=>{const i=S.findIndex(x=>x.id===s.id);if(i<0)S.push(s);else S[i]=s};
put({"id":"swift","t":"Swift core","topics":[{"t":"Value vs reference, COW","call":"Struct копируется, class — общая ссылка. Коллекции stdlib копируются лениво (COW) только при мутации; class-поле внутри struct остаётся общим.","d":["Struct с полем-классом: при копировании копируется только ссылка — `b.box.value = 10` меняет и `a`.","Массив внутри struct копируется при мутации (COW), объект класса — нет.","Свой COW: перед мутацией `isKnownUniquelyReferenced(&box)`, если не уникален — скопировать объект."],"ex":[]},{"t":"Struct vs class","call":"Struct — value, без наследования, обычно static dispatch; class — reference, ARC, наследование, deinit, identity (===).","d":["Class: наследование, `deinit`, ссылочная идентичность, подсчёт ссылок.","Struct: копирование, mutating-методы, нет ARC-накладных на сам value (если нет ссылочных полей).","По умолчанию — struct; class, когда нужна идентичность/общее состояние."],"ex":[]},{"t":"Протоколы и диспетчеризация в extension (задача P/C/S)","call":"Метод, объявленный в протоколе (requirement), — динамический через witness table; метод только в extension протокола — статический по типу переменной.","d":["Без requirement: через переменную типа протокола вызовется реализация из extension протокола.","С requirement: вызов идёт в реализацию конкретного типа (class/struct).","Ответ на задачу: без requirement — protocol/class/protocol; с ним — class/class/struct."],"ex":[]},{"t":"Generics","call":"Обобщённый код с ограничениями; при специализации компилятор генерирует версию под конкретный тип → static dispatch; без неё передаются метаданные типа и witness tables.","d":["Ограничения: `<T: Equatable>`, `where`.","Специализация (в том же модуле / WMO / `@inlinable`) убирает накладные.","Без специализации: работа через type metadata + protocol witness table."],"ex":[]},{"t":"some vs any, associatedtype","call":"some — opaque type: один конкретный тип, известный компилятору (static); any — existential: коробка с любым типом, динамический dispatch.","d":["`some View` — тип фиксирован, скрыт от вызывающего.","`any P` — existential container, может держать разные типы; дороже.","Протокол с `associatedtype`/`Self` — используем через generics или `some`; `any` с ними возможен (Swift 5.7+), но с ограничениями."],"ex":[]},{"t":"Как получить static dispatch","call":"final, private/fileprivate, WMO, методы в extension класса, struct/enum, generics/some вместо any, @inlinable; избегать dynamic.","d":["`final` / `private` — нельзя переопределить → прямой вызов.","Whole Module Optimization выводит final для internal.","`@inline(__always)`, `@_specialize`; `dynamic` включает ObjC message dispatch."],"ex":[]}]});
put({"id":"arc","t":"Память и ARC","topics":[{"t":"strong / weak / unowned","call":"strong держит; weak не держит и становится nil; unowned не держит и при обращении после освобождения — краш.","d":["weak всегда Optional var.","unowned — когда объект гарантированно живёт дольше (например `unowned let a` в B, созданном A).","Если deinit не вызвался — ищем retain cycle (Memory Graph)."],"ex":[]},{"t":"Retain cycle в замыканиях","call":"Объект держит замыкание, замыкание держит self → цикл. Лечится [weak self]; вложенное сохранённое замыкание после guard let self снова захватит self сильно.","d":["`VC → handler → замыкание → VC` — нужен ещё один `[weak self]` во вложенном.","`asyncAfter` с сильным self — не цикл, а продление жизни.","Non-escaping замыкания (`map`) не хранятся — weak не нужен."],"ex":[]},{"t":"Capture list: 3 3 3 vs 0 1 2","call":"Замыкание захватывает переменную, а не значение; [x] копирует значение в момент создания.","d":["`while` с внешней `i` → `3 3 3`; `for j in` — новая j на итерацию → `0 1 2`.","`[obj]` копирует ссылку: изменения свойств видны, переприсваивание — нет."],"ex":[]},{"t":"lazy var с self","call":"lazy var хранящая замыкание с self → цикл после первого обращения; lazy var x = { ... }() выполняется один раз и не течёт.","d":["`lazy var f: () -> Void = { [weak self] in ... }`","`lazy var label = { UILabel() }()` — безопасно."],"ex":[]},{"t":"Коллекции слабых ссылок","call":"NSHashTable.weakObjects(), NSMapTable (weak keys/values) или своя обёртка Weak<T> с ручной чисткой.","d":["`struct Weak<T: AnyObject> { weak var value: T? }`","Обёртку надо периодически чистить от nil (compactMap).","NSHashTable/NSMapTable обнуляют сами, но размер могут обновлять лениво."],"ex":[]}]});
put({"id":"gcd","t":"GCD и Operation","topics":[{"t":"Очередь vs поток","call":"Очередь — абстракция задач; GCD сам раздаёт их по пулу потоков. Serial-очередь ≠ один поток (кроме main).","d":["Плюсы GCD: пул потоков, QoS, не надо управлять жизнью потоков.","Main queue всегда на main thread."],"ex":[]},{"t":"sync / async и дедлоки","call":"sync на текущую serial-очередь (main.sync с main) — дедлок; на concurrent вложенный sync — нет.","d":["`async` возвращает сразу — код после него обычно печатается раньше.","`q.sync(flags: .barrier)` изнутри той же concurrent-очереди — дедлок.","`group.wait()`/`semaphore.wait()` на main блокирует UI."],"ex":[]},{"t":"Barrier (reader-writer)","call":"Concurrent-очередь: чтение через sync, запись через async(flags: .barrier).","d":[],"ex":[{"c":"func get() -> V { q.sync { value } }\nfunc set(_ v: V) { q.async(flags: .barrier) { self.value = v } }"}]},{"t":"Семафоры 0 / 1 / N","call":"0 — ждать событие, 1 — лок, N — лимит параллельности. Лок с 0 зависнет навсегда.","d":["Ждущие на wait() блокируют потоки GCD; нет priority inheritance.","В async-коде семафор не использовать."],"ex":[]},{"t":"DispatchGroup подвохи","call":"Сначала все enter (до async!), leave ровно один раз через defer, потом notify; на пустой группе notify срабатывает сразу.","d":["enter внутри async → может выполниться после wait/notify.","Меньше leave — notify никогда; больше — краш.","`wait` блокирует вызывающего — предпочитать `notify`."],"ex":[]},{"t":"OperationQueue и зависимости","call":"Плюсы: addDependency (даже между очередями), отмена, maxConcurrentOperationCount, KVO-состояние.","d":["Отменённая операция считается завершённой → зависимые стартуют.","BlockOperation с асинхронным вызовом завершается сразу — нужен async-подкласс Operation.","Циклическая зависимость = тихий дедлок."],"ex":[]},{"t":"Взрыв потоков (thread explosion)","call":"Заблокированные задачи заставляют GCD создавать новые потоки (лимит порядка 64) → память, переключения контекста, риск дедлока.","d":["Причины: sync/wait/семафоры внутри concurrent-очередей, много global async с блокировкой.","Лечение: не блокировать, ограничивать параллелизм, Swift Concurrency (пул = число ядер)."],"ex":[]},{"t":"Когда чистый Thread","call":"Редко: нужен свой RunLoop, долгая блокирующая работа, свой размер стека или долгоживущий выделенный поток.","d":["Иначе — GCD/Operation/async-await."],"ex":[]}]});
put({"id":"conc","t":"Swift Concurrency","topics":[{"t":"Task, структурная vs неструктурная","call":"Отмена родителя доходит до async let и TaskGroup, но не до Task {} и Task.detached — их отменяют вручную.","d":["`Task {}` наследует актор и приоритет, detached — нет.","`.task` в SwiftUI отменяется сам при исчезновении view."],"ex":[]},{"t":"Отмена кооперативная","call":"cancel() только ставит флаг; цикл без try Task.checkCancellation() доработает до конца.","d":["Проверять `Task.isCancelled` раз в N итераций."],"ex":[]},{"t":"Task.sleep / Thread.sleep / yield","call":"Task.sleep приостанавливает и отменяем; Thread.sleep блокирует поток пула; Task.yield уступает и сразу продолжает.","d":[],"ex":[]},{"t":"Акторы и reentrancy","call":"На каждом await актор может выполнять другие вызовы — логическая гонка, не data race. Фикс: inFlight: [URL: Task<...>], не NSLock.","d":["Без await внутри — атомарно.","Между чтением и записью есть await — закончить изменение до await или перечитать состояние.","NSLock нельзя держать через await."],"ex":[]},{"t":"Continuation","call":"withCheckedThrowingContinuation оборачивает колбэк в async; resume ровно один раз.","d":[],"ex":[]},{"t":"Sendable и Mutex","call":"«Mutation of captured var in concurrently-executing code» лечится Mutex (iOS 18) / OSAllocatedUnfairLock, классом-боксом @unchecked Sendable или nonisolated(unsafe) (избегать).","d":[],"ex":[{"c":"import Synchronization\nlet result = Mutex<[Int]>([])\nresult.withLock { $0.append(x) }"}]}]});
put({"id":"uikit","t":"UIKit","topics":[{"t":"Жизненный цикл VC","call":"init → loadView → viewDidLoad (разово, без размеров) → viewWillAppear → viewIsAppearing → layout (размеры финальные) → viewDidAppear → willDisappear → didDisappear → deinit.","d":["Push A→B: B load/didLoad, A willDisappear, B willAppear, …, A didDisappear, B didAppear.","Прерванный свайп-назад: willAppear без didAppear.","pageSheet (iOS 13+): презентующий не получает disappear.","viewDidLoad повторится, только если view выгрузили вручную (`vc.view = nil`)."],"ex":[]},{"t":"viewDidLoad vs viewWillAppear — ошибки","call":"В viewDidLoad — разовая настройка; то, что должно обновляться на каждом показе (данные, nav bar, геометрия, аналитика показа), — в willAppear/didAppear.","d":["Размеры в viewDidLoad не финальные → viewDidLayoutSubviews/viewIsAppearing.","Подписки симметрично: willAppear/willDisappear (или did-пары).","Обратная ошибка: тяжёлая разовая настройка в willAppear — повторяется на каждом показе."],"ex":[]},{"t":"Стек навигации","call":"VC в стеке UINavigationController живут (сильные ссылки), deinit — только после pop; view сами не выгружаются (с iOS 6), viewDidLoad при возврате не вызывается.","d":[],"ex":[]},{"t":"Hit-testing и responder chain","call":"hitTest идёт сверху вниз по subviews в обратном порядке, пропуская hidden, alpha < 0.01, userInteraction off и точки вне point(inside:); событие поднимается вверх по next-responder.","d":["Расширить зону тапа — переопределить `point(inside:with:)`.","Цепочка: view → superview → VC → … → window → UIApplication → AppDelegate.","Если никто не обработал — событие просто отбрасывается."],"ex":[]},{"t":"Клавиатура","call":"view.endEditing(true) или sendAction(#selector(resignFirstResponder), to: nil, …) — nil target уходит first responder’у.","d":[],"ex":[{"c":"UIApplication.shared.sendAction(#selector(UIResponder.resignFirstResponder), to: nil, from: nil, for: nil)"}]},{"t":"Intrinsic content size, hugging/compression","call":"Натуральный размер view по контенту (UILabel, UIButton); hugging — сопротивление растяжению, compression resistance — сжатию.","d":["Self-sizing ячейки: непрерывная цепочка констрейнтов + `automaticDimension`.","Свой view: переопределить `intrinsicContentSize` + `invalidateIntrinsicContentSize()`."],"ex":[]},{"t":"Фреймы vs Auto Layout","call":"Фреймы — ручной расчёт, быстро, но всё руками; Auto Layout — декларативные констрейнты, адаптивность, дороже на сложных иерархиях.","d":["setNeedsLayout — пометить; layoutIfNeeded — выполнить сразу (в анимациях)."],"ex":[]}]});
put({"id":"render","t":"Рендеринг и производительность","topics":[{"t":"Core Animation","call":"Каждый UIView держит CALayer; CA композитит дерево слоёв на GPU в render server; model/presentation layer; анимации идут вне main.","d":["Implicit-анимации у самостоятельных слоёв, у layer view они отключены.","Транзакции (CATransaction) коммитятся в конце runloop."],"ex":[]},{"t":"Offscreen rendering и blending","call":"cornerRadius + masksToBounds, mask, тень без shadowPath → offscreen; прозрачность → blending.","d":["Тени: задавать `shadowPath`.","Непрозрачные view (`isOpaque`, фон) уменьшают blending.","`shouldRasterize` — только для статичного контента."],"ex":[]},{"t":"Оптимизация таблиц","call":"Переиспользование ячеек, лёгкий cellForRow, фиксированные/кэшированные высоты, фоновое декодирование и downsampling картинок, prefetching.","d":["prepareForReuse — сброс и отмена загрузки, не настройка.","Плоская иерархия, без лишних констрейнтов.","Не трогать сеть/диск на main."],"ex":[]},{"t":"Instruments","call":"Time Profiler, Allocations/Leaks, Core Animation / Hitches, Memory Graph Debugger.","d":[],"ex":[]}]});
put({"id":"swiftui","t":"SwiftUI","topics":[{"t":"List vs LazyVStack","call":"List — переиспользует ячейки (на основе коллекций UIKit), LazyVStack лениво создаёт, но не переиспользует. Главное — стабильные id и лёгкий body.","d":["Избегать `id: \\.self` для изменяемых данных и `AnyView`.","Выносить подвью, чтобы сужать инвалидацию."],"ex":[]},{"t":"Обёртки состояния","call":"@State владеет, @Binding меняет чужое, @Environment/@EnvironmentObject — из окружения (нет объекта — краш).","d":["@Observable (iOS 17) — отслеживание по конкретным свойствам, меньше лишних перерисовок.","@ViewBuilder → _ConditionalContent для if/else."],"ex":[]},{"t":"@FocusState","call":"Управление фокусом/клавиатурой: @FocusState var focused: Bool + .focused($focused); focused = false скрывает клавиатуру.","d":[],"ex":[]}]});
put({"id":"storage","t":"Хранение и сеть","topics":[{"t":"Keychain","call":"Зашифрованное хранилище для секретов (токены, пароли); SecItem API, атрибуты доступности (WhenUnlocked…), access groups для шаринга.","d":["Данные могут пережить удаление приложения.","SecItem-вызовы потокобезопасны, но синхронные — не дёргать на main в горячем пути."],"ex":[]},{"t":"UserDefaults","call":"plist для маленьких настроек; потокобезопасен; не для секретов и больших данных (грузится в память).","d":[],"ex":[]},{"t":"Кэширование","call":"NSCache (память, потокобезопасен, чистится при нехватке памяти), URLCache (HTTP), файлы в Caches; плюс инвалидация (TTL, ETag, версии).","d":["Caches — система может удалить.","Application Support — то, что терять нельзя.","tmp — временные файлы."],"ex":[]},{"t":"Нормализация vs денормализация","call":"Нормализация — без дублей, связи по id; денормализация — дублируем ради скорости чтения ценой синхронизации.","d":[],"ex":[]}]});

put({id:"swift",t:"Swift core",topics:[
{t:"Value vs reference, COW",call:"Struct/enum копируются при присваивании, class — общая ссылка. Коллекции stdlib (Array, Dictionary, Set, String) делают реальную копию буфера только при мутации неуникального буфера — copy-on-write. Поле-класс внутри struct остаётся общим.",
d:["Копия struct копирует поля: value-поля — по значению, поле-класс — только ссылку (объект общий).","COW не «магия struct», а реализация конкретных типов: внутри Array лежит ссылка на буфер в куче; при мутации проверяется `isKnownUniquelyReferenced`, и если ссылок > 1 — буфер копируется.","Свои struct получают COW только если вы сами его реализуете (обёртка над классом + проверка уникальности).","Подвох: `let` у struct запрещает мутацию полей, но у `let` на класс можно менять свойства объекта.","`isKnownUniquelyReferenced` принимает `inout` и работает только с Swift-классами."],
ex:[{n:"Struct с массивом и полем-классом",c:R`
final class Counter { var value = 0 }
struct State {
    var items = [1]
    let box = Counter()
}
var a = State()
var b = a
b.items.append(2)     // COW: у b теперь свой буфер
b.box.value = 10      // объект общий
print(a.items, a.box.value)  // [1] 10
print(b.items, b.box.value)  // [1, 2] 10`},
{n:"Свой COW через isKnownUniquelyReferenced",c:R`
final class Storage { var values: [Int]; init(_ v: [Int]) { values = v } }

struct MyList {
    private var storage = Storage([])
    var values: [Int] { storage.values }

    mutating func append(_ x: Int) {
        if !isKnownUniquelyReferenced(&storage) {
            storage = Storage(storage.values)   // копия только при общей ссылке
        }
        storage.values.append(x)
    }
}
var l1 = MyList(); l1.append(1)
var l2 = l1          // общий storage
l2.append(2)         // здесь копия
print(l1.values, l2.values)  // [1] [1, 2]`}]},
{t:"Struct vs class",call:"Struct — value-тип: копируется, без наследования, без deinit, мутации через mutating. Class — reference: идентичность (===), наследование, deinit, ARC. По умолчанию struct; class — когда нужна идентичность или общее изменяемое состояние.",
d:["Class: подсчёт ссылок (retain/release — атомарные операции), аллокация в куче, возможны retain cycles.","Struct: обычно на стеке/инлайн, но может попасть в кучу (захват в escaping-замыкание, existential больше 3 слов, поля-коллекции).","Методы struct диспетчеризуются статически; у class — через vtable, если не `final`.","Struct с `let`-экземпляром нельзя мутировать; `mutating func` получает `self` как `inout`.","Для Sendable: struct из Sendable-полей автоматически Sendable (если не public), класс — только `final` с `let`-полями или с синхронизацией."],
ex:[{n:"Разница в поведении копии",c:R`
struct PointS { var x = 0 }
final class PointC { var x = 0 }

var s1 = PointS(); var s2 = s1; s2.x = 5
let c1 = PointC(); let c2 = c1; c2.x = 5
print(s1.x, c1.x)   // 0 5
print(c1 === c2)    // true`}]},
{t:"Протоколы и диспетчеризация в extension (задача P/C/S)",call:"Метод, объявленный в протоколе (requirement), вызывается динамически через witness table — выполнится реализация типа. Метод, который есть только в extension протокола, вызывается статически по объявленному типу переменной.",
d:["Requirement → запись в protocol witness table → `any P` вызовет реализацию конкретного типа.","Не requirement (только в `extension P`) → статический вызов: через `any P` всегда реализация из extension, даже если у типа есть свой метод с тем же именем.","Ловушка с наследованием: если базовый класс берёт дефолтную реализацию из extension, witness table базового класса указывает на дефолт; переопределение в подклассе через `any P` не вызовется.","Ответ на нашу задачу: без requirement — protocol / class / protocol; с requirement — class / class / struct."],
ex:[{n:"Requirement vs только extension",c:R`
protocol P { func a() }               // a — requirement
extension P {
    func a() { print("P.a") }
    func b() { print("P.b") }         // b — только в extension
}
struct S: P {
    func a() { print("S.a") }
    func b() { print("S.b") }
}
let x: any P = S()
x.a()      // S.a  — witness table
x.b()      // P.b  — статически по типу any P
S().b()    // S.b  — статически по типу S`},
{n:"Ловушка с подклассом",c:R`
protocol Greeter { func hello() }
extension Greeter { func hello() { print("default") } }

class Base: Greeter {}                 // взял дефолт из extension
class Sub: Base { func hello() { print("Sub") } }  // не override!

let g: any Greeter = Sub()
g.hello()        // default
(Sub()).hello()  // Sub
// Фикс: объявить hello() в Base, а в Sub — override func hello()`}]},
{t:"Generics",call:"Обобщённый код с ограничениями (`<T: Equatable>`, `where`). Компилятор может специализировать функцию под конкретный тип — тогда вызовы статические и инлайнятся; без специализации функция получает метаданные типа и witness tables и вызывает через них.",
d:["Специализация — оптимизация `-O`, не гарантия: работает, когда тело видно (тот же модуль, WMO, `@inlinable`).","Без специализации: одна реализация на все T, в неё неявно передаются type metadata (размер, копирование) и witness table каждого протокола-ограничения.","`associatedtype` — «generic внутри протокола»: конкретный тип выбирает реализация (`Element` у `Sequence`).","Type erasure (`AnyPublisher`, `AnySequence`, свой `AnyCache<V>`) — способ спрятать конкретный тип; с Swift 5.7 часто заменяется на `any P<V>` (primary associated types).","Generic vs `any`: generic сохраняет тип и статичен, `any` стирает тип и всегда динамичен."],
ex:[{n:"Ограничения и where",c:R`
func maxElement<T: Comparable>(_ xs: [T]) -> T? {
    guard var m = xs.first else { return nil }
    for x in xs where x > m { m = x }
    return m
}
print(maxElement([3, 7, 1]) ?? -1)   // 7

func allEqual<C: Collection>(_ c: C) -> Bool where C.Element: Equatable {
    guard let f = c.first else { return true }
    return c.allSatisfy { $0 == f }
}
print(allEqual("aaa"))   // true`},
{n:"associatedtype + type erasure",c:R`
protocol Cache {
    associatedtype Value
    func get(_ key: String) -> Value?
}
final class StringCache: Cache {
    func get(_ key: String) -> String? { "hello" }  // Value = String
}
struct AnyCache<Value>: Cache {
    private let _get: (String) -> Value?
    init<C: Cache>(_ base: C) where C.Value == Value { _get = base.get }
    func get(_ key: String) -> Value? { _get(key) }
}
let caches: [AnyCache<String>] = [AnyCache(StringCache())]`}]},
{t:"some vs any, associatedtype",call:"`some P` — opaque type: один конкретный тип, известный компилятору и скрытый от вызывающего, вызовы статические. `any P` — existential: коробка, в которой в рантайме может лежать любой тип, вызовы через witness table. В Swift 6 `any` пишется обязательно.",
d:["Existential container: буфер на 3 слова (не влезло — в кучу) + метаданные + witness table → дороже по памяти и вызовам.","`some` в возврате: функция обязана вернуть один и тот же тип на всех путях.","Каждое `some` — отдельный тип: `var s: some Shape = Circle()` потом нельзя присвоить `Circle()` заново.","`any Equatable == any Equatable` не компилируется — внутри могут быть разные типы; решение — generic `<T: Equatable>(_ a: T, _ b: T)`.","Primary associated types (5.7+): `protocol Cache<Value>` → `any Cache<UIImage>`, `some Collection<Int>`."],
ex:[{n:"Где что компилируется",c:R`
protocol Shape { func area() -> Double }
struct Circle: Shape { var r: Double; func area() -> Double { .pi * r * r } }
struct Square: Shape { var a: Double; func area() -> Double { a * a } }

let shapes: [any Shape] = [Circle(r: 1), Square(a: 2)]   // ✅ разнородно
// let bad: [some Shape] = [Circle(r: 1), Square(a: 2)]  // ❌

// func make(_ round: Bool) -> some Shape { round ? Circle(r: 1) : Square(a: 1) } // ❌ два типа
func make(_ round: Bool) -> any Shape { round ? Circle(r: 1) : Square(a: 1) }    // ✅

func total(_ s: some Shape) -> Double { s.area() }  // = generic <T: Shape>`},
{n:"Self/Equatable и стирание",c:R`
// let a: any Equatable = 1; let b: any Equatable = "x"; a == b   // ❌
func same<T: Equatable>(_ a: T, _ b: T) -> Bool { a == b }     // ✅
print(same(1, 1))   // true`}]},
{t:"Четыре вида диспетчеризации",call:"Static — адрес функции известен при компиляции (struct/enum, `final`, `private`, методы в extension класса, специализированные generics). Vtable — overridable методы класса: индекс в таблице класса. Witness table — вызов требования протокола через `any P` или неспециализированный generic. Message — `objc_msgSend` по селектору (`@objc dynamic`), ищется в рантайме.",
d:["От быстрого к медленному: static (можно инлайнить) → vtable (одно косвенное обращение) → witness table (косвенное + existential-контейнер) → message (поиск в кеше методов/иерархии).","Главный выигрыш static — не сам вызов, а инлайнинг и оптимизации после него.","Vtable есть только у классов; у struct методов в таблице нет — нечего переопределять.","Message dispatch нужен для KVO, swizzling, `#selector`/target-action (там достаточно `@objc`, без `dynamic`).","Один и тот же метод может вызываться по-разному: через `S()` — static, через `any P` — witness table."],
ex:[{n:"Один метод — разные способы вызова",c:R`
protocol Drawable { func draw() }
struct Circle: Drawable { func draw() { print("circle") } }
class Shape { func draw() { print("shape") } }
final class Square: Shape { override func draw() { print("square") } }

Circle().draw()                  // static
let d: any Drawable = Circle()
d.draw()                         // witness table
let s: Shape = Square()
s.draw()                         // vtable → square
func render<T: Drawable>(_ x: T) { x.draw() }   // witness table или static после специализации
render(Circle())`}]},
{t:"Protocol extension: default, where, композиция",call:"Extension протокола даёт реализацию по умолчанию; `extension P where Self: UIView` / `where Element: Equatable` — реализация только для подходящих типов. Композиция `P & Q` вместо больших протоколов. Conditional conformance: `extension Array: P where Element: P`. Протоколы — основа DI и моков в тестах.",
d:["Default-реализация, объявленная и в протоколе (requirement), переопределяется типом динамически; только в extension — статически (см. задачу P/C/S).","Маленькие протоколы (`Loading`, `Caching`) легче мокать и комбинировать, чем один «God protocol».","`AnyObject`-ограничение (`protocol Delegate: AnyObject`) нужно для `weak var delegate`.","Associated type / `Self`-требования делают протокол непригодным для `any P` без стирания до Swift 5.7; с 5.7 — `any P` можно, но методы с `Self` в аргументах недоступны."],
ex:[{n:"Default, where и conditional conformance",c:R`
protocol Describable { var text: String { get } }
extension Describable { var text: String { "\(Self.self)" } }          // default

struct User: Describable {}
print(User().text)                       // User

extension Array: Describable where Element: Describable {
    var text: String { map(\.text).joined(separator: ", ") }
}
print([User(), User()].text)             // User, User

extension Collection where Element: Numeric {
    var total: Element { reduce(0, +) }
}
print([1, 2, 3].total)                   // 6`},

    init(api: any Loading, cache: any Caching) { self.api = api; self.cache = cache }

}
struct MockAPI: Loading { func load() async throws -> Data { Data("ok".utf8) } }`}]},
{t:"Как получить static dispatch",call:"`final` и `private`/`fileprivate` (нельзя переопределить), WMO (компилятор сам выводит final для internal), методы в extension класса, struct/enum, generics и `some` вместо `any`, `@inlinable` для кросс-модульной специализации. `dynamic`/`@objc dynamic` — наоборот, message dispatch.",
d:["Виды: static (прямой адрес, можно инлайнить) → vtable (class, overridable) → witness table (протоколы, `any`) → message dispatch (`objc_msgSend`, `dynamic`).","Методы в `extension` класса не попадают в vtable → статические (и их нельзя override без `@objc`).","WMO (Whole Module Optimization, по умолчанию в Release) видит весь модуль и делает internal-классы без наследников фактически final.","`@inline(__always)`, `@_specialize` (подчёркнутый, неофициальный) — точечные подсказки.","Влияние на собесе: static dispatch даёт инлайн и дальнейшие оптимизации, а не просто «на пару наносекунд быстрее»."],
ex:[{n:"",c:R`
class Feed: NSObject {
    final func reload() {}          // static
    private func log() {}           // static
    func render() {}                // vtable
    @objc dynamic func track() {}   // message dispatch (KVO/swizzling)
}
extension Feed { func helper() {} } // static, нельзя override

final class Cache {}                // все методы static`}]}

put({id:"arc",t:"Память и ARC",topics:[
{t:"ARC: strong / weak / unowned",call:"ARC считает сильные ссылки на объекты класса и освобождает объект, когда их 0. `strong` держит; `weak` не держит и обнуляется в nil (всегда Optional var); `unowned` не держит и не обнуляется — обращение после освобождения = краш.",
d:["Счётчики (strong, unowned, weak) хранятся в объекте/side table; retain/release — атомарные, поэтому не бесплатны.","`weak` — когда объект может умереть раньше (делегат, родитель, self в замыкании).","`unowned` — когда объект гарантированно живёт не меньше (дочерний объект, созданный и принадлежащий владельцу). Плюс: не Optional.","`unowned(unsafe)` — без проверок, как `assign` в Obj-C: висячий указатель.","Проверка утечки: `deinit` не вызвался → Memory Graph Debugger / Instruments Leaks."],
ex:[{n:"weak разрывает цикл",c:R`
final class Owner { var pet: Pet?;  deinit { print("Owner deinit") } }
final class Pet   { weak var owner: Owner?; deinit { print("Pet deinit") } }

var o: Owner? = Owner()
o!.pet = Pet()
o!.pet!.owner = o
o = nil
// Owner deinit
// Pet deinit
// Без weak — ничего не напечатается (цикл)`},
{n:"unowned: двухфазная инициализация и краш",c:R`
final class Customer {
    var card: Card!
    init() { card = Card(owner: self) }   // можно: card — IUO (= nil), все свойства уже заданы
}
final class Card { unowned let owner: Customer; init(owner: Customer) { self.owner = owner } }

var card: Card?
do { let c = Customer(); card = c.card }   // Customer освобождён

{t:"Retain cycle в замыканиях",call:"Объект хранит escaping-замыкание, замыкание сильно захватывает self → цикл. Лечится `[weak self]`. Подвох: после `guard let self` во внешнем замыкании вложенное сохранённое замыкание снова захватит self сильно — нужен ещё один `[weak self]`.",
d:["Цикл возникает только если замыкание кто-то хранит (свойство, массив хендлеров, таймер, NotificationCenter-токен).","Non-escaping (`map`, `forEach`) — цикла нет. `UIView.animate` — escaping, но UIKit не хранит блок после анимации → `[weak self]` не нужен.","`DispatchQueue.main.asyncAfter { self... }` — не цикл, а продление жизни: код выполнится на уже закрытом экране.","`Timer.scheduledTimer(target: self…)` держит target сильно, а RunLoop держит таймер → `invalidate()` обязателен.","`let c = a.closure; a = nil` — объект умрёт, но замыкание живёт в `c`; с `unowned self` внутри вызов крашнется, с `weak` — nil."],

put({id:"gcd",t:"GCD и Operation",topics:[
{t:"Очередь ≠ поток",call:"Очередь — это список задач и правило их выполнения (serial/concurrent). Потоки берутся из пула GCD. Serial-очередь выполняет по одной задаче, но не обязательно на одном и том же потоке. Только main queue привязана к main thread.",
d:["Serial: следующая задача стартует после окончания предыдущей → очередь сама по себе синхронизирует доступ.","Concurrent: несколько задач одновременно, порядок старта FIFO, порядок завершения — любой.","Global queues — concurrent с QoS: `.userInteractive`, `.userInitiated`, `.default`, `.utility`, `.background`.","`sync` по возможности выполняет задачу на вызывающем потоке (оптимизация) — поэтому `Thread.current` внутри sync может быть main.","Target queue: свои очереди в итоге выполняются через global-очереди пула."],
ex:[{n:"",c:R`
let serial = DispatchQueue(label: "serial")
let concurrent = DispatchQueue(label: "conc", attributes: .concurrent)

for i in 1...3 { serial.async { print("s", i) } }      // s 1, s 2, s 3 — строго по порядку
for i in 1...3 { concurrent.async { print("c", i) } }  // порядок любой`}]},
{t:"sync, async и deadlock",call:"`sync` блокирует текущий поток до выполнения блока; `async` — ставит в очередь и сразу возвращается. Deadlock: `sync` на serial-очередь изнутри неё самой (в т.ч. `main.sync` с main) — блок ждёт текущую задачу, а она ждёт блок.",
d:["Вложенный `sync` в ту же concurrent-очередь — не deadlock (если нет barrier и не исчерпан пул).","`DispatchQueue.main.sync` из фонового потока — ок, но опасно, если main в этот момент ждёт этот фоновый поток.","Перекрёстный deadlock: A.sync{ B.sync{} } и параллельно B.sync{ A.sync{} }.","`dispatchPrecondition(condition: .onQueue(q))` — проверка в debug, на какой очереди мы находимся."],
ex:[{n:"Порядок печати",c:R`
let q = DispatchQueue(label: "q")
print("A")
q.async { print("B") }
print("C")
// A C B  (почти всегда; B может быть и раньше C — гарантии нет)

print("A")
q.sync { print("B") }
print("C")
// A B C  — гарантированно`},
{n:"Deadlock и не-deadlock",c:R`
let serial = DispatchQueue(label: "s")
serial.async {
    serial.sync { print("never") }   // 💥 deadlock (в debug — краш с EXC_BAD_INSTRUCTION)
}

let conc = DispatchQueue(label: "c", attributes: .concurrent)
conc.async {
    conc.sync { print("ok") }        // ✅ ok
}

// В Playground на main:
// DispatchQueue.main.sync { }      // 💥 deadlock`}]},
{t:"Barrier: потокобезопасный словарь",call:"Читатели–писатели: concurrent-очередь, чтение через `sync`, запись через `async(flags: .barrier)`. Barrier-блок ждёт завершения всех начатых чтений и выполняется один, новые чтения ждут его.",
d:["Barrier работает только на своей concurrent-очереди; на global-очереди он ведёт себя как обычный async.","Чтение `sync`, потому что нужен результат; запись `async`, чтобы не блокировать вызывающего.","Подвох read-modify-write: `d[k] = (d[k] ?? 0) + 1` из двух вызовов — гонка логики даже с потокобезопасными get/set → нужен атомарный метод `modify`.","Альтернативы: NSLock / `OSAllocatedUnfairLock` (iOS 16) / `Mutex` (iOS 18) / actor."],
ex:[{n:"SafeDict",c:R`
final class SafeDict<K: Hashable & Sendable, V: Sendable>: @unchecked Sendable {
    private var storage: [K: V] = [:]
    private let q = DispatchQueue(label: "safe.dict", attributes: .concurrent)

    subscript(key: K) -> V? {
        get { q.sync { storage[key] } }
        set { q.async(flags: .barrier) { self.storage[key] = newValue } }
    }
    func modify(_ key: K, _ body: @escaping @Sendable (inout V?) -> Void) {
        q.async(flags: .barrier) { body(&self.storage[key]) }
    }
}

let d = SafeDict<String, Int>()
DispatchQueue.concurrentPerform(iterations: 1000) { _ in
    d.modify("n") { $0 = ($0 ?? 0) + 1 }
}
print(d["n"]!)   // 1000  (с d["n"] = (d["n"] ?? 0) + 1 было бы < 1000)`}]},
{t:"DispatchSemaphore: 0, 1, N",call:"Счётчик: `wait()` уменьшает и блокирует при < 0, `signal()` увеличивает и будит. Значение 0 — ждать события, 1 — мьютекс, N — ограничение параллелизма до N.",
d:["Semaphore(0) превращает async в sync — антипаттерн на main (фриз, watchdog) и может дать deadlock, если callback приходит на ту же очередь.","Semaphore не знает о приоритетах → priority inversion (lock / Mutex знают владельца).","`wait(timeout:)` возвращает `.success`/`.timedOut`.","Semaphore блокирует поток: внутри Swift Concurrency (async-функций) использовать нельзя."],

{n:"N — не больше 2 загрузок одновременно",c:R`

{t:"DispatchGroup",call:"Ждать несколько асинхронных задач: `enter()` перед каждой, `leave()` ровно один раз в каждом исходе, `notify(queue:)` — когда счётчик стал 0. `wait()` — блокирующий вариант.",
d:["`enter()` вызывать до старта async-работы, а не внутри неё — иначе `notify` может сработать раньше.","`leave()` больше чем `enter()` → краш; забыли `leave()` → notify не придёт никогда. Помогает `defer { group.leave() }`.","`queue.async(group:)` сам делает enter/leave, но только для синхронного тела блока.","Результаты собирать потокобезопасно (serial-очередь, lock) — колбэки приходят с разных потоков."],
ex:[{n:"",c:R`
final class Results: @unchecked Sendable {
    private let lock = NSLock()
    private(set) var items: [Int] = []
    func add(_ x: Int) { lock.lock(); items.append(x); lock.unlock() }
}
let group = DispatchGroup()
let results = Results()

for i in 1...3 {
    group.enter()                         // до async
    DispatchQueue.global().asyncAfter(deadline: .now() + .milliseconds(100 * i)) {
        defer { group.leave() }
        results.add(i)
    }
}
group.notify(queue: .main) {
    print(results.items.sorted())   // [1, 2, 3]
}`}]},
{t:"Operation и OperationQueue",call:"Обёртка над GCD с зависимостями (`addDependency`), отменой (`cancel()` + проверка `isCancelled`), `maxConcurrentOperationCount` и KVO-состояниями. Нужна, когда задачи связаны графом или их надо отменять/ограничивать.",
d:["`cancel()` только ставит флаг: операция сама должна проверять `isCancelled`; отменённая операция считается завершённой → зависимые от неё всё равно стартуют.","Асинхронная операция: переопределить `isAsynchronous`, `isExecuting`, `isFinished` с KVO-уведомлениями, иначе очередь сочтёт её завершённой сразу.","`maxConcurrentOperationCount = 1` делает очередь serial по выполнению, но порядок задают зависимости и приоритет.","Цикл зависимостей → операции не выполнятся никогда."],
ex:[{n:"Зависимости и отмена",c:R`

save.addDependency(parse)

// download → parse → save

    override func main() {
        for i in 0..<1_000 {
            if isCancelled { return }   // проверяем сами
            _ = i
        }
    }
}`}]},

d:["Каждый поток — память под стек (512 КБ у вторичных) и переключения контекста.","Swift Concurrency решает это кооперативным пулом: потоков ≈ числу ядер, а `await` не блокирует поток.","Priority inversion: высокий QoS ждёт низкий через семафор → система не может поднять приоритет; у serial-очереди и `os_unfair_lock` она это умеет.","`DispatchQueue.concurrentPerform` — правильный способ распараллелить цикл по ядрам."],

put({id:"conc",t:"Swift Concurrency",topics:[
{t:"async/await и кооперативный пул",call:"`await` — точка приостановки: функция отдаёт поток, а не блокирует его. Продолжение может выполниться на другом потоке. Пул потоков ограничен числом ядер, поэтому блокировать его (semaphore, sleep, sync-ожидание) нельзя.",
d:["После `await` нельзя полагаться на тот же поток; изоляция гарантирована только актором (`@MainActor` вернёт на main).","Состояние между `await` могло измениться — проверять заново (реентрантность).","`Task { }` наследует актора, приоритет и task-locals; `Task.detached` — ничего не наследует.","Swift 6 (6.2, Xcode 26): nonisolated async-функции по умолчанию могут выполняться на акторе вызывающего (`NonisolatedNonsendingByDefault`), для ухода в пул — `@concurrent`. Это включается флагом / Approachable Concurrency."],
ex:[{n:"Порядок выполнения",c:R`
func work() async -> Int {
    try? await Task.sleep(for: .milliseconds(100))
    return 1
}
Task {
    print("1")
    let x = await work()   // поток свободен 100 мс
    print("2", x)
}
print("0")
// 0 1 2 1  (Task стартует асинхронно; "0" почти всегда первым)`}]},
{t:"Structured concurrency: async let и TaskGroup",call:"`async let` — фиксированное число параллельных дочерних задач; `withTaskGroup` — динамическое. Дочерние задачи не переживают родителя: отмена родителя отменяет детей, ошибка в группе отменяет остальных при выходе.",
d:["`async let` без `await` в конце скоупа — задача неявно отменяется и ожидается.","`withThrowingTaskGroup`: первая ошибка из `next()`/`for try await` пробрасывается, остальные задачи отменяются.","Результаты группы приходят в порядке завершения, а не добавления — порядок восстанавливать по индексу.","Ограничение параллелизма в группе: стартовать N задач, затем добавлять по одной после каждого `next()`."],
ex:[{n:"async let",c:R`
func loadUser() async -> String { "Roman" }
func loadFeed() async -> [Int] { [1, 2, 3] }

func screen() async {
    async let user = loadUser()
    async let feed = loadFeed()     // обе идут параллельно
    let (u, f) = await (user, feed)
    print(u, f.count)               // Roman 3
}`},
{n:"TaskGroup с сохранением порядка и лимитом 3",c:R`
func fetch(_ i: Int) async -> String { "item\(i)" }

func fetchAll(_ ids: [Int]) async -> [String] {
    await withTaskGroup(of: (Int, String).self) { group in
        var result = [String](repeating: "", count: ids.count)
        var next = 0
        for _ in 0..<min(3, ids.count) {
            let i = next; group.addTask { (i, await fetch(ids[i])) }; next += 1
        }
        while let (i, value) = await group.next() {
            result[i] = value
            if next < ids.count {
                let j = next; group.addTask { (j, await fetch(ids[j])) }; next += 1
            }
        }
        return result
    }
}
// await fetchAll([5, 6, 7, 8]) → ["item5", "item6", "item7", "item8"]`}]},
{t:"Отмена задач",call:"Отмена кооперативная: `task.cancel()` ставит флаг, код сам проверяет `Task.isCancelled` или вызывает `try Task.checkCancellation()` (бросает `CancellationError`). `Task.sleep` и URLSession сами реагируют на отмену.",
d:["Отмена распространяется вниз по дереву дочерних задач, но не на `Task {}` / `Task.detached` внутри — это неструктурированные задачи.","`withTaskCancellationHandler` — немедленная реакция (отменить URLSessionTask, закрыть сокет).","SwiftUI `.task` отменяет задачу при исчезновении view; `.task(id:)` — при смене id.","Хранить `Task` и отменять в `deinit`/`viewWillDisappear` для UIKit."],

{t:"Task.sleep vs Thread.sleep, Task.yield",call:"`Task.sleep` приостанавливает задачу, поток свободен, реагирует на отмену. `Thread.sleep` блокирует поток пула — нельзя. `Task.yield()` даёт другим задачам выполниться в длинном цикле.",
d:["`Task.sleep(for: .seconds(1))` (iOS 16+) или `nanoseconds:`.","В долгом CPU-цикле внутри async — периодически `await Task.yield()` и проверять отмену.","Тяжёлую синхронную работу лучше вынести из кооперативного пула (своя очередь + continuation), чтобы не занимать его поток."],
ex:[{n:"",c:R`
func heavy() async throws -> Int {
    var sum = 0
    for i in 0..<1_000_000 {
        sum &+= i
        if i % 10_000 == 0 {
            try Task.checkCancellation()
            await Task.yield()

{t:"Actor и реентрантность",call:"Actor сериализует доступ к своему состоянию: одновременно выполняется один фрагмент кода. Но на каждом `await` внутри метода актор освобождается и может выполнять другие вызовы — состояние после `await` надо перепроверять.",
d:["Вызов метода актора снаружи — всегда `await` (возможное ожидание очереди).","Классическая ошибка: проверили кеш → `await` загрузка → записали. Два одновременных вызова оба промахнутся и загрузят дважды.","Фикс: хранить in-flight `Task` в словаре и отдавать его вторым вызывающим.","`nonisolated` — метод не трогает изолированное состояние, вызывается без await.","Данные, пересекающие границу актора, должны быть Sendable (поэтому `Data`, а не `UIImage`)."],
ex:[{n:"❌ Двойная загрузка",c:R`
actor ImageCache {
    private var cache: [URL: Data] = [:]
    func image(_ url: URL) async throws -> Data {
        if let d = cache[url] { return d }
        let (d, _) = try await URLSession.shared.data(from: url)   // тут актор свободен
        cache[url] = d        // второй вызов уже тоже грузит
        return d
    }
}`},
{n:"✅ Дедупликация через in-flight Task",c:R`
actor ImageLoader {
    private enum Entry { case loading(Task<Data, Error>), ready(Data) }
    private var entries: [URL: Entry] = [:]

    func data(for url: URL) async throws -> Data {
        switch entries[url] {
        case .ready(let d)?: return d
        case .loading(let t)?: return try await t.value
        case nil: break
        }
        let task = Task { try await URLSession.shared.data(from: url).0 }
        entries[url] = .loading(task)          // до первого await!
        do {
            let d = try await task.value
            entries[url] = .ready(d)
            return d
        } catch {
            entries[url] = nil                 // чтобы можно было повторить
            throw error
        }
    }
}`}]},
{t:"@MainActor и Sendable",call:"`@MainActor` — глобальный актор main-потока: UI-код, view model. `Sendable` — тип можно безопасно передать между доменами изоляции. В Swift 6 нарушения — ошибки компиляции.",
d:["Sendable автоматически: value-типы из Sendable-полей, акторы, `final class` только с `let` Sendable-полями.","`@unchecked Sendable` — обещание компилятору, что синхронизация сделана вручную (lock/очередь).","`@Sendable` замыкание не может захватывать изменяемые `var`.","`MainActor.assumeIsolated { }` — для колбэков, про которые известно, что они на main, но компилятор не знает.","`await MainActor.run { }` — перейти на main из async-кода."],
ex:[{n:"",c:R`
@MainActor
final class FeedViewModel {
    private(set) var items: [String] = []
    func load() async {
        let data = await Service().fetch()   // уходит с main
        items = data                          // снова на main
    }
}
final class Service: Sendable {
    func fetch() async -> [String] { ["a", "b"] }
}`}]},
{t:"Continuations: мост от колбэков",call:"`withCheckedThrowingContinuation` превращает completion-handler в async. `resume` нужно вызвать ровно один раз: два раза — краш, ни разу — задача зависнет навсегда (checked выдаст предупреждение в лог).",
d:["`withChecked…` проверяет двойной/пропущенный resume в рантайме; `withUnsafe…` — без проверок, чуть быстрее.","`resume(with: Result)` — удобно для Result-колбэков.","Делегатные API: сохранить continuation в свойство и резюмить в методе делегата; следить, чтобы второй запрос не перезаписал первый.","Для потоков событий — `AsyncStream` и его `continuation.yield`/`finish`."],
ex:[{n:"",c:R`
func legacyLoad(_ id: Int, completion: @escaping @Sendable (Result<String, Error>) -> Void) {
    DispatchQueue.global().async { completion(.success("user \(id)")) }
}

func load(_ id: Int) async throws -> String {
    try await withCheckedThrowingContinuation { cont in
        legacyLoad(id) { result in
            cont.resume(with: result)   // ровно один раз
        }
    }
}
// let u = try await load(7)  → "user 7"`},

func ticks(_ n: Int) -> AsyncStream<Int> {
    AsyncStream { cont in
        for i in 1...n { cont.yield(i) }
        cont.finish()
    }
}
// for await t in ticks(3) { print(t) }   // 1 2 3`}]},
{t:"Блокировки: Mutex, OSAllocatedUnfairLock, NSLock",call:"Для короткой синхронной критической секции быстрее lock, чем actor. `Mutex` (iOS 18, `import Synchronization`) и `OSAllocatedUnfairLock` (iOS 16, `import os`) — замыкание `withLock`, сами Sendable. `NSLock` — классика, но не держать lock через `await`.",
d:["Actor — когда нужна асинхронность и изоляция состояния; lock — когда нужен синхронный доступ без await.","`os_unfair_lock` в Swift напрямую как `var` использовать нельзя (адрес не стабилен) — отсюда OSAllocatedUnfairLock.","Рекурсивный захват — deadlock (кроме `NSRecursiveLock`).","Атомики: `Atomic<Int>` из Synchronization (iOS 18)."],
ex:[{n:"Mutex + concurrentPerform",c:R`
import Synchronization

let sum = Mutex(0)
DispatchQueue.concurrentPerform(iterations: 100) { i in
    sum.withLock { $0 += i }
}
print(sum.withLock { $0 })   // 4950`},

import os

final class Counter: Sendable {
    private let state = OSAllocatedUnfairLock(initialState: 0)
    func increment() { state.withLock { $0 += 1 } }
    var value: Int { state.withLock { $0 } }
}`}]}

{t:"Жизненный цикл UIViewController",call:"`loadView` → `viewDidLoad` (один раз) → `viewWillAppear` → `viewIsAppearing` (iOS 13+, размеры и trait уже известны) → `viewWillLayoutSubviews`/`viewDidLayoutSubviews` (много раз) → `viewDidAppear`. Уход: `viewWillDisappear` → `viewDidDisappear`. `deinit` — когда VC больше никто не держит.",
d:["`loadView` переопределяют, только чтобы задать свой корневой view (`view = MyView()`), без `super`.","`view` загружается лениво: обращение к `vc.view` до показа вызовет `loadView` + `viewDidLoad` сразу.","`viewWillAppear`/`viewDidAppear` вызываются при каждом показе (возврат по back, закрытие модалки `.fullScreen`).","Модалка `.pageSheet`/`.formSheet` (по умолчанию с iOS 13): нижний VC остаётся на экране → его `viewWillDisappear`/`viewWillAppear` НЕ вызываются.","Layout-методы — для расчётов, зависящих от размеров; там не создавать view и не добавлять констрейнты (вызываются многократно)."],

{t:"viewDidLoad vs viewWillAppear: что куда",call:"`viewDidLoad` — однократная настройка: иерархия, констрейнты, подписки, первый запрос. `viewWillAppear`/`viewIsAppearing` — то, что обновляется при каждом показе (данные, навбар, выделение ячейки). Геометрия — не в `viewDidLoad`.",
d:["Ошибка: читать `view.bounds` в `viewDidLoad` — размер ещё из xib/дефолта, не финальный.","Ошибка: подписываться на Notification в `viewWillAppear` без отписки → множественные подписки.","Ошибка: стартовать запрос в `viewWillAppear` без защиты → повтор при каждом возврате.","Таймеры/анимации запускать в `viewDidAppear`, останавливать в `viewDidDisappear`."],
ex:[{n:"",c:R`

d:["`setViewControllers(_:animated:)` — заменить весь стек (например, после логина).","Модальный показ: presenting VC держит presented; `dismiss` вызывается на любом из них.","Без `addChild` дочерний VC не получает appearance-колбэки и trait changes.","Координатор — выносит переходы из VC; VC сообщает о событии через замыкание/делегат."],

{t:"Hit-testing и responder chain",call:"Касание ищется сверху вниз: `hitTest(_:with:)` от окна рекурсивно, в обратном порядке subviews (верхний первым). View пропускается, если скрыт, `alpha < 0.01`, `isUserInteractionEnabled == false` или точка вне `point(inside:)`. Событие, не обработанное view, идёт вверх по responder chain: view → superview → VC → … → window → application.",
d:["Subview за пределами bounds родителя не получает касания (даже если видна при `clipsToBounds = false`) — родитель отсекает по `point(inside:)`.","Увеличить зону нажатия: переопределить `point(inside:)` с `bounds.insetBy(dx: -20, dy: -20)`.","Пропускающий view (оверлей): вернуть nil, если hitTest попал в сам view.","Жесты распознаются параллельно: gesture recognizer получает touches раньше view и может отменить их (`cancelsTouchesInView`)."],
ex:[{n:"Как устроен hitTest",c:R`
extension UIView {
    func myHitTest(_ point: CGPoint, with event: UIEvent?) -> UIView? {
        guard isUserInteractionEnabled, !isHidden, alpha >= 0.01,
              self.point(inside: point, with: event) else { return nil }
        for sub in subviews.reversed() {
            let p = sub.convert(point, from: self)
            if let hit = sub.myHitTest(p, with: event) { return hit }
        }
        return self
    }
}`},
{n:"Зона нажатия +20pt и сквозной оверлей",c:R`
final class BigTapButton: UIButton {
    override func point(inside point: CGPoint, with event: UIEvent?) -> Bool {
        bounds.insetBy(dx: -20, dy: -20).contains(point)
    }
}

final class PassThroughView: UIView {
    override func hitTest(_ point: CGPoint, with event: UIEvent?) -> UIView? {
        let hit = super.hitTest(point, with: event)
        return hit === self ? nil : hit   // касания по пустому месту уходят ниже
    }
}`}]},
{t:"Клавиатура: скрыть и подвинуть",call:"Скрыть: `view.endEditing(true)` или `UIApplication.shared.sendAction(#selector(UIResponder.resignFirstResponder), to: nil, from: nil, for: nil)` — `to: nil` отправляет first responder'у. Для скролла: `keyboardDismissMode = .interactive`. Подвинуть контент: `view.keyboardLayoutGuide` (iOS 15+).",
d:["`sendAction` с `to: nil` идёт по responder chain от first responder, возвращает `Bool` — нашёлся ли обработчик.","`endEditing(true)` ищет first responder только внутри этого view.","Старый способ: `keyboardWillShowNotification` + `keyboardFrameEndUserInfoKey` → `contentInset.bottom`.","Тап по фону: `UITapGestureRecognizer` с `cancelsTouchesInView = false`, иначе сломает тапы по ячейкам."],

UIApplication.shared.sendAction(#selector(UIResponder.resignFirstResponder),

d:["Свой view с естественным размером: переопределить `intrinsicContentSize` и звать `invalidateIntrinsicContentSize()` при изменении данных.","Два лейбла в ряд: тот, что должен сжиматься (обрезаться), получает меньший compression resistance.","`UIView.noIntrinsicMetric` — для измерения, которого нет.","Ambiguous layout ищется через `hasAmbiguousLayout`, `exerciseAmbiguityInLayout()`, View Debugger; конфликты — в логе `Unable to simultaneously satisfy constraints`."],

{t:"Как кадр попадает на экран",call:"Main thread: layout → display (draw) → prepare (декодирование картинок) → commit дерева слоёв в render server. Render server и GPU рисуют кадр. На 60 Гц бюджет 16,7 мс, на 120 Гц (ProMotion) — 8,3 мс. Hitch = кадр не успел.",
d:["Commit происходит в конце итерации RunLoop (`CATransaction`), поэтому изменения в одном цикле объединяются.","Commit hitch — долгий main thread (layout, тяжёлый draw, декодирование). Render hitch — тяжёлая работа render server (offscreen, blending, огромные слои).","Декодирование JPEG/PNG происходит лениво при первом показе на main — отсюда фризы в списках.","Инструменты: Instruments → Animation Hitches, Time Profiler; Xcode → Debug → View Debugging."],

{t:"CALayer: неявные анимации и model/presentation",call:"Изменение анимируемого свойства отдельного CALayer анимируется неявно (0,25 с). У слоя, принадлежащего UIView, неявные анимации отключены (view возвращает NSNull в `action(for:forKey:)`) — кроме блока `UIView.animate`. Анимация меняет только presentation layer, model value нужно выставлять самому.",

{t:"Плавные списки: reuse, prefetching, downsampling",call:"Ячейки переиспользуются (`dequeueReusableCell`) — сбрасывать состояние в `prepareForReuse` и отменять загрузку. Prefetching (`UITableViewDataSourcePrefetching`) стартует загрузку заранее. Картинки декодировать и уменьшать до размера ячейки в фоне (ImageIO thumbnail или `preparingThumbnail(of:)`).",
d:["Классический баг: асинхронная картинка приходит в уже переиспользованную ячейку → проверять, что ячейка всё ещё для этого id/URL.","Декодированная картинка 4000×3000 = 48 МБ памяти (×4 байта/пиксель) — независимо от размера файла.","`UIImage.preparingForDisplay()` / `byPreparingThumbnail(ofSize:)` (iOS 15) — декодирование вне main.","Высоты ячеек: self-sizing с корректными констрейнтами или кеш высот; `estimatedRowHeight` близкий к реальному.","Diffable data source — анимации без ручного `performBatchUpdates` и без крашей рассинхрона."],
ex:[{n:"Reuse-безопасная загрузка",c:R`
final class PhotoCell: UITableViewCell {
    private var task: Task<Void, Never>?
    private var url: URL?

    func configure(url: URL, loader: ImageLoader) {
        self.url = url
        task = Task { [weak self] in
            guard let data = try? await loader.data(for: url),
                  let img = await UIImage(data: data)?.byPreparingThumbnail(ofSize: CGSize(width: 160, height: 160))
            else { return }
            guard let self, self.url == url else { return }   // ячейку уже переиспользовали?
            self.imageView?.image = img
        }
    }
    override func prepareForReuse() {
        super.prepareForReuse()
        task?.cancel(); task = nil
        imageView?.image = nil
    }
}`},
{n:"Downsampling через ImageIO",c:R`
import ImageIO

func downsample(_ data: Data, maxPixel: CGFloat) -> CGImage? {
    let src = CGImageSourceCreateWithData(data as CFData, [kCGImageSourceShouldCache: false] as CFDictionary)!
    let opts = [
        kCGImageSourceCreateThumbnailFromImageAlways: true,
        kCGImageSourceShouldCacheImmediately: true,      // декодировать сейчас (в фоне)
        kCGImageSourceCreateThumbnailWithTransform: true,
        kCGImageSourceThumbnailMaxPixelSize: maxPixel,   // pt × scale
    ] as CFDictionary
    return CGImageSourceCreateThumbnailAtIndex(src, 0, opts)
}`},

struct SearchBar: UIViewRepresentable {
    @Binding var text: String

    func makeUIView(context: Context) -> UISearchBar {
        let bar = UISearchBar()
        bar.delegate = context.coordinator
        return bar

ex:[{n:"Сохранить и прочитать токен",c:R`
import Security

enum Keychain {
    static func save(_ value: String, key: String) -> Bool {
        let base: [String: Any] = [
            kSecClass as String: kSecClassGenericPassword,
            kSecAttrAccount as String: key,
        ]
        SecItemDelete(base as CFDictionary)              // убрать старое
        var add = base
        add[kSecValueData as String] = Data(value.utf8)
        add[kSecAttrAccessible as String] = kSecAttrAccessibleAfterFirstUnlock
        return SecItemAdd(add as CFDictionary, nil) == errSecSuccess
    }

    static func read(_ key: String) -> String? {
        let query: [String: Any] = [
            kSecClass as String: kSecClassGenericPassword,
            kSecAttrAccount as String: key,
            kSecReturnData as String: true,
            kSecMatchLimit as String: kSecMatchLimitOne,
        ]
        var out: AnyObject?
        guard SecItemCopyMatching(query as CFDictionary, &out) == errSecSuccess,
              let data = out as? Data else { return nil }
        return String(decoding: data, as: UTF8.self)
    }
}
_ = Keychain.save("abc123", key: "token")
print(Keychain.read("token") ?? "nil")   // abc123  (на устройстве/симуляторе)`}]},

ex:[{n:"NSCache для картинок",c:R`
final class ImageMemoryCache {
    private let cache = NSCache<NSURL, UIImage>()
    init() {
        cache.countLimit = 200
        cache.totalCostLimit = 100 * 1024 * 1024   // ~100 МБ
    }
    func set(_ img: UIImage, for url: URL) {
        let cost = Int(img.size.width * img.scale * img.size.height * img.scale * 4)
        cache.setObject(img, forKey: url as NSURL, cost: cost)
    }
    func get(_ url: URL) -> UIImage? { cache.object(forKey: url as NSURL) }
}`},

enum APIError: Error { case http(Int), decoding(Error) }

struct API {
    let session: URLSession = .shared
    func get<T: Decodable>(_ url: URL, as: T.Type = T.self) async throws -> T {
        let (data, resp) = try await session.data(from: url)   // URLError, CancellationError
        guard let http = resp as? HTTPURLResponse else { throw URLError(.badServerResponse) }
        guard (200..<300).contains(http.statusCode) else { throw APIError.http(http.statusCode) }
        do {
            let decoder = JSONDecoder()
            decoder.keyDecodingStrategy = .convertFromSnakeCase
            return try decoder.decode(T.self, from: data)

func binarySearch(_ a: [Int], _ x: Int) -> Int? {
    var lo = 0, hi = a.count - 1
    while lo <= hi {
        let mid = lo + (hi - lo) / 2
        if a[mid] == x { return mid }
        if a[mid] < x { lo = mid + 1 } else { hi = mid - 1 }
    }
    return nil

func views(at depth: Int, in root: UIView) -> [UIView] {

    guard depth >= 0 else { return [] }

{n:"Очередь с head-индексом и тест на простом дереве",c:R`
final class Node { let v: Int; var kids: [Node]; init(_ v: Int, _ k: [Node] = []) { self.v = v; kids = k } }
let root = Node(1, [Node(2, [Node(4), Node(5)]), Node(3, [Node(6)])])

func bfs(_ root: Node) -> [Int] {
    var queue = [root], head = 0, out: [Int] = []
    while head < queue.count {
        let n = queue[head]; head += 1
        out.append(n.v)
        queue.append(contentsOf: n.kids)
    }
    return out
}
func dfs(_ n: Node) -> [Int] { [n.v] + n.kids.flatMap(dfs) }

print(bfs(root))   // [1, 2, 3, 4, 5, 6]
print(dfs(root))   // [1, 2, 4, 5, 3, 6]`}]},

{t:"Класс: .h, .m, init",call:"`.h` — публичный `@interface`, `.m` — `@implementation` и приватный class extension `@interface Feed ()`. `-` — метод экземпляра, `+` — метод класса. Все объекты — по указателю (`NSString *`). `init` может вернуть nil, поэтому `self = [super init]; if (self) {...}`.",
d:["В `init`/`dealloc` обращаться к ivar (`_title`), а не через `self.title` — сеттер может быть переопределён в подклассе.","`instancetype` — «тип текущего класса» (как `Self`).","`@property` синтезирует ivar `_name`, геттер `name` и сеттер `setName:`.","Имя метода (селектор) складывается из частей: `initWithTitle:`, `addItem:atIndex:`."],
ex:[{n:"",c:R`
// Feed.h
@interface Feed : NSObject
@property (nonatomic, copy) NSString *title;
- (instancetype)initWithTitle:(NSString *)title;
+ (instancetype)feedWithTitle:(NSString *)title;
@end

// Feed.m
@interface Feed ()                       // приватное
@property (nonatomic, strong) NSMutableArray<NSString *> *items;
@end

@implementation Feed
- (instancetype)initWithTitle:(NSString *)title {
    self = [super init];
    if (self) {
        _title = [title copy];
        _items = [NSMutableArray array];
    }
    return self;
}

put({id:"tasks",t:"Задачи и ревью",topics:[
{t:"Как вести ревью вслух",call:"Порядок: 1) краши и гонки, 2) неверное поведение (не та картинка, UI не с main), 3) архитектура (DI, отмена, дедупликация, тестируемость), 4) производительность и память. Каждую проблему: что не так → к чему приводит → как исправить.",
d:["Сначала одной фразой сказать, что делает код, — показывает, что ты его понял.","Не тонуть в стиле (имена, отступы) — интервьюеру важны баги и компромиссы.","Предлагать минимальный фикс, затем «как сделал бы в проде».","Если не уверен — сказать, как проверишь (Thread Sanitizer, Main Thread Checker, тест)."],
ex:[]},
{t:"Ревью ImageFetcher: проблемы",call:"Гонка на словаре `cache` (запись из фонового потока URLSession), два force unwrap, completion не на main → UIKit с фона, неверная картинка в переиспользованной ячейке, нет отмены, дубли запросов на один URL, нет проверки статуса/ошибки, неограниченный кеш без реакции на memory warning, синглтон без DI, разные потоки completion (кеш — синхронно, сеть — асинхронно).",
d:["**Гонка**: `cache[url] = image` из потоков URLSession + чтение с main → краш/повреждение. Фикс: NSCache или serial-очередь/lock/actor.","**Force unwrap**: `data!` при ошибке сети, `UIImage(data:)!` на не-картинке/HTML 404 → краш. Фикс: guard, статус-код, `Result`.","**Поток**: completion из фоновой очереди → `avatarView.image = ` не на main (Main Thread Checker). Фикс: переход на main у вызывающего или явно в API.","**Reuse**: ячейку переиспользовали, а старый запрос вернулся → чужой аватар. Фикс: сохранять URL/токен, сравнивать; `prepareForReuse` — отмена и сброс.","**Отмена и дедуп**: прокрутка генерирует сотни запросов; один URL качается N раз. Фикс: токен отмены, in-flight словарь колбэков.","**Память**: словарь растёт бесконечно, декодированные картинки полного размера. Фикс: NSCache с cost, downsampling.","**Синглтон**: прямой `ImageFetcher.shared` в ячейке → нельзя подменить в тестах. Фикс: протокол + инъекция.","**Мелочи**: `self` в замыкании держит ячейку до конца запроса; кеш отвечает синхронно, сеть — асинхронно (непредсказуемый порядок)."],
ex:[{n:"Исходный код",c:R`
final class ImageFetcher {
    static let shared = ImageFetcher()
    var cache: [URL: UIImage] = [:]

    func fetch(_ url: URL, completion: @escaping (UIImage?) -> Void) {
        if let image = cache[url] { completion(image); return }
        URLSession.shared.dataTask(with: url) { data, response, error in
            let image = UIImage(data: data!)!
            self.cache[url] = image
            completion(image)
        }.resume()
    }
}
final class AvatarCell: UITableViewCell {
    let avatarView = UIImageView()
    func configure(with user: User) {
        ImageFetcher.shared.fetch(user.avatarURL) { image in
            self.avatarView.image = image
        }
    }
}`}]},
{t:"ImageFetcher: исправленная версия (колбэки)",call:"NSCache для памяти, serial-очередь для состояния in-flight, токен для отмены, один сетевой запрос на URL, проверка статуса, completion всегда на main. Ячейка хранит токен и текущий URL, отменяет в `prepareForReuse`.",
d:["Отмена одного подписчика не отменяет загрузку, если на неё ещё кто-то подписан.","Попадание в кеш — тоже асинхронно на main (или явно документировать синхронный ответ).","Swift 6: колбэк `@MainActor @Sendable` — компилятор проверит, что UI трогаем на main, а захваты безопасны.","На async/await то же самое проще: actor + in-flight `Task` (см. Swift Concurrency → Actor и реентрантность)."],
ex:[{n:"Загрузчик",c:R`
protocol ImageLoading {
    @discardableResult
    func load(_ url: URL, completion: @escaping @MainActor @Sendable (UIImage?) -> Void) -> UUID?
    func cancel(_ token: UUID)
}

final class ImageLoader: ImageLoading, @unchecked Sendable {
    private let cache = NSCache<NSURL, UIImage>()
    private let session: URLSession
    private let queue = DispatchQueue(label: "image.loader")       // защищает поля ниже
    private var waiters: [URL: [UUID: @MainActor @Sendable (UIImage?) -> Void]] = [:]
    private var tasks: [URL: URLSessionDataTask] = [:]

    init(session: URLSession = .shared) { self.session = session; cache.countLimit = 300 }

    @discardableResult
    func load(_ url: URL, completion: @escaping @MainActor @Sendable (UIImage?) -> Void) -> UUID? {
        if let img = cache.object(forKey: url as NSURL) {
            DispatchQueue.main.async { completion(img) }
            return nil
        }
        let token = UUID()
        queue.async {
            self.waiters[url, default: [:]][token] = completion
            guard self.tasks[url] == nil else { return }               // уже грузится — ждём
            let task = self.session.dataTask(with: url) { data, resp, _ in
                let ok = (resp as? HTTPURLResponse)?.statusCode == 200
                let image = ok ? data.flatMap(UIImage.init(data:)) : nil
                if let image { self.cache.setObject(image, forKey: url as NSURL) }
                self.queue.async {
                    let callbacks = self.waiters.removeValue(forKey: url) ?? [:]
                    self.tasks[url] = nil
                    DispatchQueue.main.async { callbacks.values.forEach { $0(image) } }
                }
            }
            self.tasks[url] = task
            task.resume()
        }
        return token
    }

    func cancel(_ token: UUID) {
        queue.async {
            for (url, var w) in self.waiters where w[token] != nil {
                w[token] = nil
                if w.isEmpty {                       // больше никто не ждёт
                    self.waiters[url] = nil
                    self.tasks.removeValue(forKey: url)?.cancel()
                } else {
                    self.waiters[url] = w
                }
            }
        }
    }
}`},
{n:"Ячейка",c:R`

    let avatarView = UIImageView()
    private var token: UUID?
    private var currentURL: URL?
    var loader: ImageLoading!                       // инъекция

    func configure(with user: User) {

{t:"Многопоточный обход дерева (DFS + DispatchGroup)",call:"Каждый узел обрабатывается в отдельной задаче: `group.enter()` до `async`, `leave()` в `defer`; общий результат — под lock/Mutex; ждать через `notify`, а не `wait` на main. Порядок результата недетерминирован. UIView можно читать только на main — для UIKit-дерева параллелизм не подходит.",
d:["`enter()` внутри async — `notify` может сработать, пока дети ещё не добавлены.","`leave()` вне критической секции; `unlock` — через `defer`.","Swift 6: захват изменяемого `var` в `@Sendable` — ошибка → `Mutex` (iOS 18) или `@unchecked Sendable` класс с NSLock.","Для маленького дерева параллелизм медленнее последовательного обхода (накладные расходы на задачи); для CPU-работы — `concurrentPerform` или TaskGroup.","Узлы дерева должны быть Sendable (иммутабельные `let`)."],
ex:[{n:"GCD-версия",c:R`
final class Node: Sendable {
    let value: Int
    let children: [Node]
    init(_ v: Int, _ c: [Node] = []) { value = v; children = c }
}

final class Collector: @unchecked Sendable {
    private let lock = NSLock()
    private var values: [Int] = []
    func add(_ v: Int) { lock.lock(); defer { lock.unlock() }; values.append(v) }
    var result: [Int] { lock.lock(); defer { lock.unlock() }; return values }
}

func parallelDFS(_ root: Node, completion: @escaping @Sendable ([Int]) -> Void) {
    let group = DispatchGroup()
    let out = Collector()
    @Sendable func visit(_ n: Node) {
        group.enter()                                  // до async
        DispatchQueue.global().async {
            defer { group.leave() }
            out.add(n.value)
            n.children.forEach(visit)                  // дети тоже enter до своего async
        }
    }
    visit(root)
    group.notify(queue: .main) { completion(out.result) }
}

let tree = Node(1, [Node(2, [Node(4)]), Node(3)])
parallelDFS(tree) { print($0.sorted()) }   // [1, 2, 3, 4]  (без sorted — порядок любой)`},

func sum(_ n: Node) async -> Int {
    await withTaskGroup(of: Int.self) { group in
        for child in n.children { group.addTask { await sum(child) } }
        var total = n.value
        for await s in group { total += s }
        return total
    }
}
// await sum(tree)  → 10`}]},

{t:"Property wrappers и KeyPath",
call:"Property wrapper (`@propertyWrapper`) выносит логику хранения свойства в тип с `wrappedValue`; `projectedValue` доступен через `$` (так устроены `@State` и `$binding`). KeyPath — типизированная ссылка на свойство: `\\User.name`; бывают `KeyPath` (чтение), `WritableKeyPath` (запись в value-тип), `ReferenceWritableKeyPath` (запись в класс). С Swift 5.2 KeyPath можно передать как функцию: `users.map(\\.name)`.",
d:["Компилятор разворачивает `@Clamped var v` в приватное хранилище `_v: Clamped` и вычисляемое `v { _v.wrappedValue }`.",
"Обёртки не работают как stored в extension и на глобальных `let`; можно на локальных переменных (Swift 5.4+).",
"KeyPath используются в SwiftUI (`ForEach(items, id: \\.id)`), Combine (`assign(to:on:)`), KVO (`observe(\\.title)`), сортировке: `sorted { $0[keyPath: kp] < $1[keyPath: kp] }`.",
"`\\.self` — путь к самому значению."],
ex:[{n:"Своя обёртка и KeyPath",c:R`
@propertyWrapper
struct Clamped {
    private var value: Int
    let range: ClosedRange<Int>
    init(wrappedValue: Int, _ range: ClosedRange<Int>) {
        self.range = range
        value = min(max(wrappedValue, range.lowerBound), range.upperBound)
    }
    var wrappedValue: Int {
        get { value }
        set { value = min(max(newValue, range.lowerBound), range.upperBound) }
    }
    var projectedValue: ClosedRange<Int> { range }
}
struct Volume { @Clamped(0...10) var level = 5 }

var v = Volume()
v.level = 42
print(v.level, v.$level)          // 10 0...10

struct User { var name: String; var age: Int }
var users = [User(name: "Ann", age: 30), User(name: "Bob", age: 25)]
print(users.map(\.name))          // ["Ann", "Bob"]
let kp: WritableKeyPath<User, Int> = \.age
users[0][keyPath: kp] += 1
print(users.sorted { $0.age < $1.age }.map(\.name), users[0].age)  // ["Bob", "Ann"] 31
`}]},

import Foundation
struct Post: Decodable {
    let id: Int
    let title: String
    let authorName: String?
    let likes: Int
    enum CodingKeys: String, CodingKey { case id, title, authorName, likes }
    init(from decoder: Decoder) throws {
        let c = try decoder.container(keyedBy: CodingKeys.self)
        id = try c.decode(Int.self, forKey: .id)
        title = try c.decode(String.self, forKey: .title)
        authorName = try c.decodeIfPresent(String.self, forKey: .authorName)
        likes = try c.decodeIfPresent(Int.self, forKey: .likes) ?? 0
    }
}
let json = #"{"id": 1, "title": "Hi", "author_name": null}"#.data(using: .utf8)!
let d = JSONDecoder()
d.keyDecodingStrategy = .convertFromSnakeCase
let p = try d.decode(Post.self, from: json)
print(p.title, p.authorName as Any, p.likes)   // Hi nil 0
`}]}

S.forEach(s=>{const g=G[s.id];if(!g)return;const used=new Set();
 s.subs=g.map(([id,t,sum,pref])=>({id,t,sum,topics:pref.map(p=>{const i=s.topics.findIndex((x,j)=>!used.has(j)&&x.t.startsWith(p));if(i<0)throw new Error('no topic '+s.id+':'+p);used.add(i);return s.topics[i]})}));
 if(used.size!==s.topics.length)throw new Error('unassigned in '+s.id+': '+s.topics.filter((x,j)=>!used.has(j)).map(x=>x.t));});

const app=document.getElementById('app'),bar=document.getElementById('bar');
let query='';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function tableHTML(x){return `<div class="tw"><table><thead><tr>${x.h.map(c=>`<th>${fmt(c)}</th>`).join('')}</tr></thead><tbody>${x.r.map(r=>`<tr>${r.map((c,i)=>i?`<td>${fmt(c)}</td>`:`<th>${fmt(c)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function topicHTML(t,lbl){const d=t.d||[],ex=t.ex||[],tb=t.tb||[];const has=d.length||ex.length||tb.length;
return `<details class="topic"><summary><div class="tt">${esc(t.t)}</div>${lbl?`<div class="sec-lbl">${esc(lbl)}</div>`:''}<div class="call"><b>Для созвона:</b> ${fmt(t.call)}</div>${has?'<div class="more">▸ подробнее и примеры</div>':''}</summary>${has?`<div class="det">${tb.length?`<h4>Сравнение</h4>${tb.map(tableHTML).join('')}`:''}${d.length?`<h4>Подробнее</h4><ul>${d.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`:''}${ex.length?`<h4>Примеры</h4>${ex.map(e=>`${e.n?`<div class="cap">${fmt(e.n)}</div>`:''}<pre><code>${esc(e.c.replace(/^\n/,''))}</code></pre>`).join('')}`:''}</div>`:''}</details>`}
function home(){
bar.innerHTML=`<span class="ttl">iOS · VK собес</span>`;
app.innerHTML=`<h1>Повтор перед собесом</h1><div class="sub">Тапни раздел или ищи по всем темам и коду.</div><input id="q" type="search" placeholder="Поиск по всем темам…" value="${esc(query)}" autocomplete="off"><div id="res"></div>`;
const q=document.getElementById('q');q.oninput=()=>{query=q.value;results()};results();}
function results(){
const r=document.getElementById('res'),ql=query.trim().toLowerCase();
if(!ql){r.innerHTML='<div class="grid">'+S.map((s,i)=>`<a class="tile" href="#${s.id}"><div class="n">${i+1}${s.check?'':' · '+s.topics.length+' тем'}</div><div class="h">${esc(s.t)}</div><div class="c">${s.check?'все «Для созвона» на одном экране':esc(s.subs.map(x=>x.t).join(' · '))}</div></a>`).join('')+'</div>';return}
let out='';S.forEach(s=>(s.subs||[]).forEach(u=>u.topics.forEach(t=>{const hay=[t.t,t.call,s.t,u.t,...(t.d||[]),...(t.tb||[]).flatMap(x=>[...x.h,...x.r.flat()]),...(t.ex||[]).map(e=>(e.n||'')+' '+e.c)].join(' ').toLowerCase();if(hay.includes(ql))out+=topicHTML(t,s.t+' › '+u.t)})));
r.innerHTML=out||'<div class="empty">Ничего не найдено</div>';}
const L=[];S.forEach(s=>(s.subs||[]).forEach(u=>L.push({s,u})));
function section(i){
const s=S[i],p=S[(i-1+S.length)%S.length],n=S[(i+1)%S.length];
bar.innerHTML=`<a class="btn" href="#">← Разделы</a><a class="btn" href="#${p.id}" aria-label="предыдущий раздел">‹</a><span class="ttl">${i+1}. ${esc(s.t)}</span><a class="btn" href="#${n.id}" aria-label="следующий раздел">›</a>`;
let h=`<h1>${esc(s.t)}</h1>`;
if(s.check){h+='<div class="sub">Все «Для созвона» на одном экране</div><div class="chk">';let k=0;S.forEach(x=>(x.subs||[]).forEach(u=>{h+=`<h3><a href="#${x.id}/${u.id}">${esc(x.t)} › ${esc(u.t)}</a></h3><ol start="${k+1}">`;u.topics.forEach(t=>{k++;h+=`<li><b>${esc(t.t)}</b><br>${fmt(t.call)}</li>`});h+='</ol>'}));h+='</div>'}
else{h+=`<div class="sub">${s.subs.length} подраздела · ${s.topics.length} тем</div>`;h+=s.subs.map(u=>`<a class="subcard" href="#${s.id}/${u.id}"><div class="h">${esc(u.t)}</div><div class="sm">${esc(u.sum)}</div><div class="tl">${u.topics.map(t=>esc(t.t)).join(' · ')}</div><div class="go">${u.topics.length} ${u.topics.length===1?'тема':u.topics.length<5?'темы':'тем'} ›</div></a>`).join('')}
h+=`<div class="nav2"><a class="btn" href="#${p.id}">‹ ${esc(p.t)}</a><a class="btn" href="#${n.id}">${esc(n.t)} ›</a></div>`;
app.innerHTML=h;}
function sub(j){
const {s,u}=L[j],p=L[(j-1+L.length)%L.length],n=L[(j+1)%L.length];
bar.innerHTML=`<a class="btn" href="#${s.id}" aria-label="к разделу">←</a><div class="crumb"><a href="#${s.id}">${esc(s.t)}</a><span>${esc(u.t)}</span></div><a class="btn" href="#${p.s.id}/${p.u.id}" aria-label="предыдущий подраздел">‹</a><a class="btn" href="#${n.s.id}/${n.u.id}" aria-label="следующий подраздел">›</a>`;
let h=`<h1>${esc(u.t)}</h1><div class="sub"><a href="#">Разделы</a> › <a href="#${s.id}">${esc(s.t)}</a> · ${esc(u.sum)}</div>`;
h+=u.topics.map(t=>topicHTML(t)).join('');
h+=`<div class="nav2"><a class="btn" href="#${p.s.id}/${p.u.id}">‹ ${esc(p.u.t)}</a><a class="btn" href="#${n.s.id}/${n.u.id}">${esc(n.u.t)} ›</a></div>`;
app.innerHTML=h;}
function render(){const [a,b]=decodeURIComponent(location.hash.slice(1)).split('/'),i=S.findIndex(s=>s.id===a);
if(i<0)return home();if(b){const j=L.findIndex(x=>x.s.id===a&&x.u.id===b);if(j>=0)return sub(j)}section(i)}
window.addEventListener('hashchange',()=>{render();scrollTo(0,0)});render();
</script>
